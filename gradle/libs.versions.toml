# All dependency and plugin versions live here. Always use the latest stable version.

[versions]
androidGradlePlugin = "9.4.1"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.09.00"
androidxHilt = "1.4.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.10.2"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
composeRules = "0.6.8"
# Alpha on purpose: the last stable Detekt (1.23.8) crashes on Java 25. See docs/decisions/002-code-quality-and-ci.md
detekt = "2.0.0-alpha.6"
hilt = "2.60.1"
junit = "4.13.2"
kotlin = "2.4.21"
kotlinxSerialization = "1.11.0"
ksp = "2.3.12"
ktlint = "1.8.0"
spotless = "8.10.4"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

# Extra ktlint rules for Compose code, used by Spotless in the root build.gradle.kts
compose-rules-ktlint = { group = "io.nlopez.compose.rules", name = "ktlint", version.ref = "composeRules" }

# Used only by build-logic (the shared build recipes)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Our own shared build recipes, defined in build-logic/
pdfbanao-android-application = { id = "pdfbanao.android.application" }
pdfbanao-android-feature = { id = "pdfbanao.android.feature" }
pdfbanao-android-library = { id = "pdfbanao.android.library" }
pdfbanao-android-library-compose = { id = "pdfbanao.android.library.compose" }
pdfbanao-hilt = { id = "pdfbanao.hilt" }
